<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain Ski Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  background: url("./Pictures/wp8067730-2560x1600-winter-wallpapers.jpg") no-repeat center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  
}

 
 

 
.login-card {
  display: flex;
    flex-direction: column;
  
  width: 350px;
  height: 400px;
  padding: 30px;
  border-radius: 16px;
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
   animation: fadeUp 0.8s ease; 
  color: #fff;
}

 
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
 
.logo {
  text-align: center;
transform: translate(0%,-30%);
  
}

.logo img {
  width: 300px;
  height: 150px;
}

 
.input-group {
  margin: 20px 0;
}

.input {
  width: 100%;
  border: none;
  border-bottom: 1px solid rgba(16, 13, 13, 0.5);
  background: transparent;
  padding: 10px 5px;
  color: rgb(12, 11, 11);
  outline: none;
  transition: 0.3s;
}

.input::placeholder {
  color: rgba(10, 10, 10, 0.7);
}

.input:focus {
  border-bottom: 2px solid #8A5FA2;
}

 
.forgot {
  text-align: right;
  font-size: 12px;
  margin-top: -10px;
  
}

.forgot a {
  color: black;
  text-decoration: none;
}

.forgot a:hover {
  color: #8A5FA2;
}

 
.login-btn {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #E6B980, #8A5FA2);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

 
.bottom-text {
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  color: #0f0e0e;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}

.bottom-text a {
  color: #0f0e0e;
  text-decoration: none;
  font-weight: 500;
}

.bottom-text a:hover {
  color: #8A5FA2;
}
.form{
    transform: translate(0%,-70px);
}
.heading{
    color: black;
    font-weight: 600;
    transform: translate(15%,-80px);
}
 
</style>

</head>
<body>
  <form action="home.html">

<div class="login-card">

  <div class="logo">
    <img src="./Pictures/logo.png" alt="Logo">
  </div>
  <div class="heading">
    <p>Please login to your account</p>
  </div>
 <div class="form">
  <div class="input-group">
    <input type="text" class="input" placeholder="Username">
  </div>

  <div class="input-group">
    <input type="password" class="input" placeholder="Password">
  </div>

  <div class="forgot">
    <a href="#">Forgot Password?</a>
  </div>

  <button class="login-btn">Login</button>

  <div class="bottom-text">
   <p>Don't have an account? </p> <a href="#">Register here</a>
  </div>
  </div>

</div>
</form>

</body>
</html>
